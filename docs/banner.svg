<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-label="Пътят към милиона">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16226b"/>
      <stop offset="1" stop-color="#070b1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#f5c542" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f5c542" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fb2ff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#9fb2ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a3"/>
      <stop offset="0.55" stop-color="#f5c542"/>
      <stop offset="1" stop-color="#c8961e"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" rx="28" fill="url(#sky)"/>
  <rect width="1280" height="420" rx="28" fill="url(#dots)"/>
  <polygon points="150,0 230,0 470,420 -80,420" fill="url(#beam)"/>
  <polygon points="1050,0 1130,0 1360,420 820,420" fill="url(#beam)"/>
  <polygon points="600,0 680,0 860,420 420,420" fill="url(#beam)" opacity="0.6"/>
  <ellipse cx="640" cy="190" rx="560" ry="200" fill="url(#glow)"/>

  <!-- the ladder of prizes -->
  <g fill="none" stroke="#f5c542" stroke-opacity="0.18" stroke-width="3">
    <path d="M80 380 h70 v-40 h70 v-40 h70 v-40 h70"/>
    <path d="M1200 380 h-70 v-40 h-70 v-40 h-70 v-40 h-70"/>
  </g>

  <!-- coin mark -->
  <g transform="translate(588 46)">
    <circle cx="52" cy="52" r="50" fill="url(#gold)"/>
    <circle cx="52" cy="52" r="41" fill="none" stroke="#0b1233" stroke-opacity="0.25" stroke-width="2.5"/>
    <path d="M24 77h13v-13h13v-13h13v-13h13" fill="none" stroke="#0b1233" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M80 14l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#0b1233"/>
  </g>

  <text x="640" y="236" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="800" fill="#eef1ff" letter-spacing="-1">Пътят към <tspan fill="url(#gold)">милиона</tspan></text>
  <text x="640" y="290" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#a3acd3" letter-spacing="2">15 въпроса · 4 жокера · водещ · 1 000 000 €</text>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700">
    <rect x="300" y="330" width="320" height="48" rx="24" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
    <circle cx="326" cy="354" r="15" fill="#f5c542" fill-opacity="0.18" stroke="#f5c542" stroke-opacity="0.5"/>
    <text x="326" y="361" text-anchor="middle" fill="#f5c542">А</text>
    <text x="352" y="361" fill="#eef1ff">Вземи парите</text>
    <rect x="660" y="330" width="320" height="48" rx="24" fill="#2fd17a" fill-opacity="0.3" stroke="#2fd17a"/>
    <circle cx="686" cy="354" r="15" fill="#2fd17a"/>
    <text x="686" y="361" text-anchor="middle" fill="#03240f">Б</text>
    <text x="712" y="361" fill="#eef1ff">Рискувай за милиона</text>
  </g>
</svg>
